        // ระบบ POS พนักงาน
        function addToCart(name, price) {
            const existing = cartItems.find(i => i.name === name);
            if(existing) { existing.qty += 1; } else { cartItems.push({ name, price, qty: 1 }); }
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById('cartTableBody');
            tbody.innerHTML = '';
            let total = 0;
            if(cartItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-gray-400">ยังไม่มีสินค้าในตะกร้า</td></tr>`;
                document.getElementById('cartTotalPrice').innerText = "0.00 ฿";
                return;
            }
            cartItems.forEach(item => {
                let sum = item.price * item.qty;
                total += sum;
                const row = document.createElement('tr');
                row.innerHTML = `<td class="py-2">${item.name}</td><td class="py-2 text-center">${item.qty}</td><td class="py-2 text-right">${sum.toLocaleString('en-US', { minimumFractionDigits: 2 })} ฿</td>`;
                tbody.appendChild(row);
            });
            document.getElementById('cartTotalPrice').innerText = total.toLocaleString('en-US', { minimumFractionDigits: 2 }) + " ฿";
        }

        function processCheckout() {
            if(cartItems.length === 0) {

            cartItems = [];
            renderCart();
        }

        function loadTransactionData() {
            const txId = document.getElementById('txId').value;
            const data = transactionMockup[txId];
            if(data) {
                document.getElementById('auditSupplier').value = data.supplier;
                document.getElementById('auditInvoice').value = data.invoice;
                document.getElementById('auditItems').value = data.items;
                document.getElementById('auditAmount').value = data.amount.toLocaleString('en-US', { minimumFractionDigits: 2 });
            }

        function processAuditApproval() {
            const txId = document.getElementById('txId').value;
            const dateStr = document.getElementById('txDate').value || "2026-11-07";
            const data = transactionMockup[txId];
            const channel = document.getElementById('auditPaymentChannel').value;
            
            if(!document.getElementById('checkMatch').checked) {
                alert('กรุณายืนยันจุดตรวจ Audit ความถูกต้องของสินค้าก่อนลงบัญชี');
                return;
            }

            let creditName = channel === 'transfer' ? 'ธนาคารร้าน (Bank Transfer)' : (channel === 'cash' ? 'เงินสด (Cash)' : 'เจ้าหนี้การค้า (Accounts Payable)');

            journalEntries.unshift({
                date: dateStr,
                id: txId,
                supplier: data.supplier,
                account: "สินค้าคงเหลือ (Inventory - Ministock)",
                creditAcc: creditName,
                amount: data.amount,
                type: "procurement"
            });

            filterJournalByDateRange();
            updateFinancialStatements();
            alert('อนุมัติระบบจ่ายเงินและบันทึกบัญชีสินค้าเข้าสต็อกเรียบร้อย!');
        }

        }

            let tDebit = 0, tCredit = 0;

            dataArray.forEach(item => {
                const formatted = item.amount.toLocaleString('en-US', { minimumFractionDigits: 2 });
                tDebit += item.amount;
                tCredit += item.amount;

                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                row.innerHTML = `
                    <td class="p-2.5"><div class="font-semibold text-gray-800">${item.id}</div><div class="text-[10px] text-gray-500">${item.date} (${item.supplier})</div></td>
                    <td class="p-2.5"><div class="font-medium text-red-700">${item.account}</div><div class="text-[10px] text-gray-500 pl-3">เครดิต: ${item.creditAcc}</div></td>
                    <td class="p-2.5 text-right font-bold text-gray-900">${formatted}</td>
                    <td class="p-2.5 text-right font-bold text-gray-900">${formatted}</td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('totalDebit').innerText = tDebit.toLocaleString('en-US', { minimumFractionDigits: 2 });
            document.getElementById('totalCredit').innerText = tCredit.toLocaleString('en-US', { minimumFractionDigits: 2 });
        }

        function switchReportPeriod(mode) {
            currentReportMode = mode;
            const btnM = document.getElementById('rep-monthly');
            const btnY = document.getElementById('rep-yearly');
            if(mode === 'monthly') {
                btnM.className = "px-3 py-1 rounded bg-red-600 text-white font-semibold";
                btnY.className = "px-3 py-1 rounded text-gray-700";
            } else {
                btnY.className = "px-3 py-1 rounded bg-red-600 text-white font-semibold";
                btnM.className = "px-3 py-1 rounded text-gray-700";
            }
            updateFinancialStatements();
        }

        function updateFinancialStatements() {
            let totalInventory = 0, totalAP = 0, totalExpenses = 0;
            journalEntries.forEach(item => {
                if(item.type === 'procurement') {
                    totalInventory += item.amount;
                    if(item.creditAcc.includes('เจ้าหนี้')) totalAP += item.amount;
                } else if(item.type === 'expense') {
                    totalExpenses += item.amount;
                }
            });

            let baseSales = currentReportMode === 'monthly' ? 125000 : 1500000;
            let baseCOGS = currentReportMode === 'monthly' ? 75000 : 900000;
            let grossProfit = baseSales - baseCOGS;
            let netProfit = grossProfit - totalExpenses;

            document.getElementById('plSales').innerText = "+" + baseSales.toLocaleString('en-US', { minimumFractionDigits: 2 }) + " ฿";
            document.getElementById('plCOGS').innerText = "-" + baseCOGS.toLocaleString('en-US', { minimumFractionDigits: 2 }) + " ฿";
            document.getElementById('plGrossProfit').innerText = grossProfit.toLocaleString('en-US', { minimumFractionDigits: 2 }) + " ฿";
            document.getElementById('plDynamicExp').innerText = totalExpenses.toLocaleString('en-US', { minimumFractionDigits: 2 }) + " ฿";
            document.getElementById('plNetProfit').innerText = netProfit.toLocaleString('en-US', { minimumFractionDigits: 2 }) + " ฿";

            document.getElementById('bsDynamicInventory').innerText = totalInventory.toLocaleString('en-US', { minimumFractionDigits: 2 }) + " ฿";
            document.getElementById('bsDynamicAP').innerText = totalAP.toLocaleString('en-US', { minimumFractionDigits: 2 }) + " ฿";
            document.getElementById('bsTotalAsset').innerText = (85000 + totalInventory).toLocaleString('en-US', { minimumFractionDigits: 2 }) + " ฿";
            document.getElementById('bsTotalLE').innerText = (85000 + totalAP).toLocaleString('en-US', { minimumFractionDigits: 2 }) + " ฿";
        }
    </script>
